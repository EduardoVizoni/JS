<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria Interativa</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <div class="container">
        <div class="section galeria">
            <h2>Galeria Principal</h2>
            <div class="images">
                <img src="images/Paisagem1.jpeg" alt="Imagem 1" class="draggable" draggable="true">
                <img src="images/Paisagem2.jpeg" alt="Imagem 2" class="draggable" draggable="true">
                <img src="images/Paisagem3.jpeg" alt="Imagem 3" class="draggable" draggable="true">
                <img src="images/Paisagem4.jpeg" alt="Imagem 4" class="draggable" draggable="true">
                <img src="images/Paisagem5.jpeg" alt="Imagem 5" class="draggable" draggable="true">
                <img src="images/Paisagem6.jpeg" alt="Imagem 6" class="draggable" draggable="true">
            </div>
        </div>
        <div class="section favorites">
            <h2>Favoritos <span id="favorites-count">(0)</span></h2>
            <div id="favorites-dropzone" class="dropzone"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
